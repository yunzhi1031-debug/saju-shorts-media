<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,Segoe UI,Malgun Gothic,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.7;color:#222}h1{font-size:1.5rem}h2{font-size:1.1rem;margin-top:1.6em}code{background:#f2f2f2;padding:2px 6px;border-radius:4px}</style><title>TikTok Authorization</title></head><body>
<h1>TikTok authorization / TikTok 인증</h1>
<p id="msg">Waiting for the authorization response...</p>
<script>
var q=new URLSearchParams(location.search);var code=q.get('code');var err=q.get('error');
var m=document.getElementById('msg');
if(code){m.textContent='Authorization complete. Copy the code below (it stays in this browser only):';var p=document.createElement('p');var c=document.createElement('code');c.textContent=code;c.style.wordBreak='break-all';p.appendChild(c);document.body.appendChild(p);}
else if(err){m.textContent='Authorization failed: '+err;}
</script>
</body></html>
